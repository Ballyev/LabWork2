name: Game CI Pipeline

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtest-dev \
            cmake \
            libsdl2-dev \
            libsfml-dev

          # Установка Google Test
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp *.a /usr/lib

      - name: Build game
        working-directory: ./Game
        run: |
          make clean
          make -j$(nproc) game
          [ -f ./game ] || { echo "Game binary not found!"; exit 1; }

      - name: Build tests
        working-directory: ./Game
        run: |
          make -j$(nproc) tests
          [ -f ./tests ] || { echo "Tests binary not found!"; exit 1; }

      - name: Run unit tests
        working-directory: ./Game
        run: |
          ./tests --gtest_output=xml:test_results.xml
          echo "Unit tests completed"

      - name: Test game launch
        working-directory: ./Game
        run: |
          timeout 15s ./game --test-mode || echo "Game test completed"