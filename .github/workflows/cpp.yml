name: Game CI

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtest-dev
          cd /usr/src/gtest
          sudo cmake -B build
          sudo cmake --build build
          sudo cp build/lib/libgtest*.a /usr/local/lib/

      - name: Build project
        working-directory: ./Game
        run: |
          make clean
          make -j$(nproc) game run_tests  

      - name: Run unit tests
        working-directory: ./Game
        run: |
          make test

      - name: Verify game binary
        working-directory: ./Game
        run: |
          if [ -f ./game ]; then
            echo "Game built successfully"
          else
            echo "Error: Game binary not found!"
            exit 1
          fi